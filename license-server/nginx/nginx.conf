events {
    worker_connections 256;
}

http {
    map $http_x_forwarded_proto $layer7_forwarded_proto {
        default $scheme;
        "~*^https$" https;
        "~*^http$" http;
    }

    upstream api {
        server api:3001;
    }
    upstream web {
        server web:80;
    }

    server {
        listen 80 default_server;
        server_name _;

        return 444;
    }

    server {
        listen 80;
        # F2.1: este nginx e apenas o origin privado atras do edge TLS.
        server_name license.systemup.inf.br localhost 127.0.0.1;
        server_tokens off;

        # P1-2 / BG-128: o origin substitui X-Forwarded-For do cliente.
        # Nao usar $proxy_add_x_forwarded_for. X-Forwarded-Proto = P2-3.

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:" always;

        location /api/auth/ {
            add_header Cache-Control "no-store" always;

            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $layer7_forwarded_proto;
        }

        location /api/ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $layer7_forwarded_proto;
        }

        location / {
            proxy_pass http://web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $layer7_forwarded_proto;
        }
    }

    # Primary autenticado de conteúdo (pré-30.11). Sem SPA; só /layer7/... → API.
    server {
        listen 80;
        server_name downloads.systemup.inf.br;
        server_tokens off;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Cache-Control "private, no-store" always;

        location /layer7/ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $layer7_forwarded_proto;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Layer7-Content-Token $http_x_layer7_content_token;
            proxy_buffering off;
            client_max_body_size 1m;
        }

        location = /api/health {
            proxy_pass http://api/api/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location / {
            return 404;
        }
    }
}
